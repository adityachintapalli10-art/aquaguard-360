services:
  aquaguard:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      AQUAGUARD_DB: /app/data/aquaguard.db
      SESSION_HOURS: ${SESSION_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - aquaguard-data:/app/data
    restart: unless-stopped

volumes:
  aquaguard-data:
